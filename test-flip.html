<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { background: #0A0A08; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; height: 100vh; }
  #book { width: 360px; height: 500px; }
  .page { width: 180px; height: 500px; background: #E2D9CC; overflow: hidden; box-shadow: inset 0 0 20px rgba(0,0,0,0.1); }
  .page-text { padding: 20px; color: #141310; font-family: serif; }
  .page-art { width: 100%; height: 100%; object-fit: cover; }
</style>
</head>
<body>
<div id="book">
  <div class="page" data-density="soft">
    <div class="page-text">
      <h2>01</h2>
      <p>Anatomi Tubuh Energi</p>
      <p>Kita adalah getaran yang memadat.</p>
    </div>
  </div>
  <div class="page" data-density="soft">
    <img class="page-art" src="/assets/bab_01_torus.jpg">
  </div>
  <div class="page" data-density="soft">
    <div class="page-text">
      <h2>02</h2>
      <p>Zona Theta</p>
      <p>Pintu masuk ke pikiran bawah sadar.</p>
    </div>
  </div>
  <div class="page" data-density="soft">
    <img class="page-art" src="/assets/bab_02_theta.jpg">
  </div>
</div>

<script type="module">
  import { PageFlip } from '/node_modules/page-flip/dist/js/page-flip.module.js';
  const pageFlip = new PageFlip(document.getElementById('book'), {
    width: 180,
    height: 500,
    size: 'stretch',
    showCover: false,
    drawShadow: true,
    flippingTime: 800,
    usePortrait: false,
    maxShadowOpacity: 0.5
  });
  pageFlip.loadFromHTML(document.querySelectorAll('.page'));
  window.pageFlip = pageFlip;
</script>
</body>
</html>
