<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#11110F">
  <title>SUATU SAAT — Digital Art Book</title>
  <meta name="description" content="Kamu akan membutuhkan cara lain untuk melihat dirimu sendiri. 5 Bab · 74 Halaman.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <div id="app">
    <!-- Desktop Mobile-First Experience Notice -->
    <aside id="desktop-notice" class="desktop-notice" aria-label="Catatan Pengalaman Membaca">
      <div class="dn-header">
        <span class="dn-tag">📱 Catatan Pembaca</span>
        <button id="dn-close-btn" class="dn-close-btn" aria-label="Tutup Catatan" title="Tutup">×</button>
      </div>
      <div class="dn-title">Paling Enak Dibaca di HP</div>
      <p class="dn-body">
        Buku ini dibuat memanjang untuk digenggam santai. Di laptop tetap nyaman dibaca, tapi lewat layar HP rasanya jauh lebih dekat.
      </p>
      <div class="dn-footer">
        Buka <strong>suatusaat.com</strong> langsung dari browser HP kamu.
      </div>
    </aside>

    <div class="device" id="device">
      <!-- Screens injected by TypeScript -->
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
